syntax = "proto3";

package cinema;

option java_multiple_files = true;
option java_package = "com.nqt.common.grpc.cinema";
option java_outer_classname = "CinemaProto";

service CinemaGrpcService {
  rpc GetClipForSocial(GetClipForSocialRequest) returns (ClipSocialResponse);
}

message GetClipForSocialRequest {
  int64 clip_id = 1;
  int64 requesting_user_id = 2;
}

message ClipSocialResponse {
  bool found = 1;
  int64 clip_id = 2;
  int64 user_id = 3;
  int64 goal_id = 4;
  int32 week_number = 5;
  string status = 6;
  string video_url = 7;
  string storage_path = 8;
  int32 photo_count = 9;
  string created_at = 10;
  string message = 11;
}
