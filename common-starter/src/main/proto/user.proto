syntax = "proto3";

package user;

option java_multiple_files = true;
option java_package = "com.nqt.common.grpc.user";
option java_outer_classname = "UserProto";

service UserService {
  // Dùng bởi onboarding-service để lấy userId từ email
  rpc GetUserByEmail(GetUserByEmailRequest) returns (UserResponse);

  // Để dùng sau này nếu service khác cần tra cứu ngược lại từ id
  rpc GetUserId(GetUserIdRequest) returns (UserResponse);

  // ➕ Thêm rpc cập nhật trạng thái hoàn thành onboarding
  rpc UpdateOnboardingStatus(UpdateOnboardingStatusRequest) returns (UpdateOnboardingStatusResponse);

  // ➕ Thêm rpc lấy danh sách gợi ý kết bạn
  rpc GetSuggestedUsers(GetSuggestedUsersRequest) returns (GetSuggestedUsersResponse);
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserIdRequest {
  int64 user_id = 1;
}

message UserResponse {
  int64 id = 1;
  string email = 2;
  string name = 3;
  bool found = 4;
  string avatar_url = 5;
  string bio = 6;
}

// ➕ Các message mới cho việc cập nhật onboarding
message UpdateOnboardingStatusRequest {
  int64 user_id = 1;
  bool has_completed_onboarding = 2;
}

message UpdateOnboardingStatusResponse {
  bool success = 1;
  string message = 2;
}

// ➕ Các message cho việc gợi ý kết bạn
message GetSuggestedUsersRequest {
  int64 current_user_id = 1;
  repeated int64 excluded_user_ids = 2;
  int32 limit = 3;
}

message UserSocialProfile {
  int64 id = 1;
  string email = 2;
  string name = 3;
  string avatar_url = 4;
  string bio = 5;
}

message GetSuggestedUsersResponse {
  repeated UserSocialProfile users = 1;
}