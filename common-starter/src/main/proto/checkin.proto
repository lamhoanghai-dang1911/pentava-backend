syntax = "proto3";

package checkin;

option java_multiple_files = true;
option java_package = "com.nqt.common.grpc.checkin";
option java_outer_classname = "CheckinProto";

service CheckinService {
  // Dùng bởi cinema-service để lấy danh sách ảnh check-in trong khoảng ngày của 1 user
  rpc GetCheckinsInRange(GetCheckinsInRangeRequest) returns (GetCheckinsInRangeResponse);
}

message GetCheckinsInRangeRequest {
  int64 user_id = 1;
  string start_date = 2; // ISO-8601 yyyy-MM-dd
  string end_date = 3;   // ISO-8601 yyyy-MM-dd
}

message CheckinItem {
  int64 checkin_id = 1;
  int64 task_progress_id = 2;
  string checkin_date = 3; // yyyy-MM-dd
  string image_path = 4;   // path trong Supabase bucket, KHÔNG phải URL đầy đủ
  string created_at = 5;   // ISO-8601 datetime
}

message GetCheckinsInRangeResponse {
  repeated CheckinItem items = 1;
}