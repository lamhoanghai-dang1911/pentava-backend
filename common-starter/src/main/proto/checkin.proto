syntax = "proto3";

package checkin;

option java_multiple_files = true;
option java_package = "com.nqt.common.grpc.checkin";
option java_outer_classname = "CheckinProto";

service CheckinService {
  // Dùng bởi cinema-service: lấy toàn bộ ảnh check-in của 1 user trong khoảng ngày (gồm cả 2 đầu)
  rpc GetCheckinsByDateRange(GetCheckinsByDateRangeRequest) returns (GetCheckinsByDateRangeResponse);

  // Lấy tổng dung lượng ảnh check-in và số lượng ảnh của 1 user
  rpc GetPhotoStorageSummary(GetPhotoStorageSummaryRequest) returns (GetPhotoStorageSummaryResponse);
}

message GetPhotoStorageSummaryRequest {
  int64 user_id = 1;
}

message GetPhotoStorageSummaryResponse {
  int64 total_photo_size_bytes = 1;
  int64 photo_count = 2;
}

message GetCheckinsByDateRangeRequest {
  int64 user_id = 1;
  string start_date = 2; // yyyy-MM-dd
  string end_date = 3;   // yyyy-MM-dd (gồm cả ngày này)
}

message CheckinItem {
  int64 id = 1;
  int64 task_progress_id = 2;
  string checkin_date = 3; // yyyy-MM-dd (giờ VN)
  string image_url = 4;
  string created_at = 5;   // ISO-8601 local date-time (giờ VN), có thể rỗng với dữ liệu cũ
}

message GetCheckinsByDateRangeResponse {
  repeated CheckinItem checkins = 1;
}
