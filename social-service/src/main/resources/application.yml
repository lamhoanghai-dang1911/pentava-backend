server:
  port: 8086
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: social-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/social}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:social-service-group}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET}

grpc:
  client:
    auth-service:
      address: ${GRPC_AUTH_SERVICE_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext
    cinema-service:
      address: ${GRPC_CINEMA_SERVICE_ADDRESS:static://localhost:9093}
      negotiation-type: plaintext

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.nqt: ${LOGGING_LEVEL_COM_NQT:DEBUG}
