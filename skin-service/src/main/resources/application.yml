server:
  port: 8088
  address: ${SERVER_ADDRESS:0.0.0.0}
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 500
    accept-count: 50

spring:
  application:
    name: skin-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skin}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

supabase:
  url: ${SUPABASE_URL:https://olgtvgfgpaydkopjhern.supabase.co}
  service-key: ${SUPABASE_SERVICE_KEY:}
  skin-bucket: ${SUPABASE_SKIN_BUCKET:skin}
  signed-url-expiry-seconds: ${SKIN_SIGNED_URL_EXPIRY_SECONDS:21600}

shop-service:
  url: ${SHOP_SERVICE_URI:http://localhost:8087}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9095}
  client:
    auth-service:
      address: ${GRPC_AUTH_SERVICE_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.nqt: ${LOGGING_LEVEL_COM_NQT:INFO}
