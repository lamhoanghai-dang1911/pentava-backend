server:
  port: 8088
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: skin-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skin}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

supabase:
  url: ${SUPABASE_URL:https://olgtvgfgpaydkopjhern.supabase.co}
  skin-bucket: ${SUPABASE_SKIN_BUCKET:skin}

springdoc:
  api-docs:
    path: /v3/api-docs

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9095}
  client:
    auth-service:
      address: ${GRPC_AUTH_SERVICE_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.nqt: ${LOGGING_LEVEL_COM_NQT:DEBUG}
