server:
  port: 8082
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 500
    accept-count: 50

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          debug: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

google:
  oauth:
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}
  client:
    onboarding-service:
      address: ${GRPC_ONBOARDING_SERVICE_ADDRESS:static://localhost:9092}
      negotiation-type: plaintext

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.nqt: ${LOGGING_LEVEL_COM_NQT:INFO}
    org.springframework.mail: INFO