server:
  port: 8082
#  address: 127.0.0.1 # VPS
#  address: 0.0.0.0 TEST MOBILE
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          debug: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    enabled: true

google:
  oauth:
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}
  client:
    onboarding-service:
      address: ${GRPC_ONBOARDING_SERVICE_ADDRESS:static://localhost:9092}
      negotiation-type: plaintext

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.nqt: ${LOGGING_LEVEL_COM_NQT:DEBUG}
    org.springframework.mail: DEBUG