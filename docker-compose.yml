version: "3.8"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # DB mặc định khi container khởi tạo lần đầu — các DB còn lại (auth/checkin/onboarding/cinema)
      # được tạo tự động bởi init-db.sql bên dưới (chỉ chạy khi volume pg_data còn trống)
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"   # bỏ dòng này khi lên production nếu không cần truy cập DB từ ngoài
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      target: auth-service
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms96m -Xmx192m"
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GRPC_ONBOARDING_SERVICE_ADDRESS: static://onboarding-service:9092
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
      - "9090:9090"   # gRPC server — cần expose để service khác (và host, lúc debug) gọi vào

  checkin-service:
    build:
      context: .
      target: checkin-service
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms96m -Xmx192m"
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/checkin
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GRPC_CLIENT_AUTH_SERVICE_ADDRESS: static://auth-service:9090
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8084:8084"
      # gRPC 9091 của checkin-service CỐ Ý không publish: chỉ cinema-service trong mạng Docker gọi vào.
      # Nếu cần debug từ IDE trên máy, tạm thêm dòng:  - "9091:9091"

  onboarding-service:
    build:
      context: .
      target: onboarding-service
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms128m -Xmx256m"
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onboarding
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GRPC_CLIENT_AUTH_SERVICE_ADDRESS: static://auth-service:9090
      JWT_SECRET: ${JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8083:8083"
      # gRPC 9092 của onboarding-service CỐ Ý không publish: chỉ cinema-service trong mạng Docker gọi vào.
      # Nếu cần debug từ IDE trên máy, tạm thêm dòng:  - "9092:9092"

  cinema-service:
    build:
      context: .
      target: cinema-service
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms128m -Xmx256m"
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cinema
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GRPC_AUTH_SERVICE_ADDRESS: static://auth-service:9090
      GRPC_CHECKIN_SERVICE_ADDRESS: static://checkin-service:9091
      GRPC_ONBOARDING_SERVICE_ADDRESS: static://onboarding-service:9092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      checkin-service:
        condition: service_started
      onboarding-service:
        condition: service_started
    ports:
      - "8085:8085"
      - "9093:9093"   # gRPC server cho social-service gọi sang

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 16777216
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 2
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  social-service:
    build:
      context: .
      target: social-service
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms128m -Xmx256m"
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/social
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GRPC_AUTH_SERVICE_ADDRESS: static://auth-service:9090
      GRPC_CINEMA_SERVICE_ADDRESS: static://cinema-service:9093
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      cinema-service:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8086:8086"

  skin-service:
    build:
      context: .
      target: skin-service
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms96m -Xmx192m"
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skin
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GRPC_AUTH_SERVICE_ADDRESS: static://auth-service:9090
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SKIN_BUCKET: ${SUPABASE_SKIN_BUCKET:-skin}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8088:8088"
      - "9095:9095"

  shop-service:
    build:
      context: .
      target: shop-service
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms96m -Xmx192m"
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GRPC_AUTH_SERVICE_ADDRESS: static://auth-service:9090
      GRPC_SKIN_SERVICE_ADDRESS: static://skin-service:9095
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SKIN_BUCKET: ${SUPABASE_SKIN_BUCKET:-skin}
      SUPABASE_THUMBNAIL_BUCKET: ${SUPABASE_THUMBNAIL_BUCKET:-shop_thumbnail}
      SEPAY_API_KEY: ${SEPAY_API_KEY}
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER}
      SEPAY_ACCOUNT_NAME: ${SEPAY_ACCOUNT_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      skin-service:
        condition: service_started
    ports:
      - "8087:8087"

  manage-service:
    build:
      context: .
      target: manage-service
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms96m -Xmx192m"
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/manage
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GRPC_AUTH_SERVICE_ADDRESS: static://auth-service:9090
      GRPC_ONBOARDING_SERVICE_ADDRESS: static://onboarding-service:9092
      JWT_SECRET: ${JWT_SECRET}
      OPENAPI_SERVER_URL: ${OPENAPI_SERVER_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      onboarding-service:
        condition: service_started
    ports:
      - "8089:8089"

  api-gateway:
    build:
      context: .
      target: api-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms96m -Xmx192m"
      TZ: Asia/Ho_Chi_Minh
      AUTH_SERVICE_URI: http://auth-service:8082
      ONBOARDING_SERVICE_URI: http://onboarding-service:8083
      CHECKIN_SERVICE_URI: http://checkin-service:8084
      CINEMA_SERVICE_URI: http://cinema-service:8085
      SOCIAL_SERVICE_URI: http://social-service:8086
      SHOP_SERVICE_URI: http://shop-service:8087
      SKIN_SERVICE_URI: http://skin-service:8088
      MANAGE_SERVICE_URI: http://manage-service:8089
    depends_on:
      - auth-service
      - checkin-service
      - onboarding-service
      - cinema-service
      - social-service
      - shop-service
      - skin-service
      - manage-service
    ports:
      - "8080:8080"   # cổng duy nhất cần public ra ngoài qua Nginx sau này

volumes:
  pg_data: