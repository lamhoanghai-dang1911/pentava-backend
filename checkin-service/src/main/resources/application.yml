server:
  port: 8084
  address: 0.0.0.0

spring:
  application:
    name: checkin-service
  datasource:
    url: jdbc:postgresql://localhost:5432/checkin
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    group: checkin-service

grpc:
  client:
    auth-service:
      address: 'static://localhost:9090'
      negotiation-type: plaintext