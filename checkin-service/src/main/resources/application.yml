server:
  port: 8084
  address: ${SERVER_ADDRESS:127.0.0.1}
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 500
    accept-count: 50

spring:
  application:
    name: checkin-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/checkin}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ➕ Không đặt giá trị mặc định cho secret: thiếu JWT_SECRET thì service không khởi động
jwt:
  secret: ${JWT_SECRET}

# ➕ Dùng để chỉ chấp nhận ảnh nằm đúng bucket Supabase của dự án
# SUPABASE_URL dạng: https://<project-ref>.supabase.co
supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SERVICE_KEY:}
  checkin-bucket: ${SUPABASE_CHECKIN_BUCKET:pentava-checkin-images}
  signed-url-expiry-seconds: ${CHECKIN_SIGNED_URL_EXPIRY_SECONDS:21600}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    group: checkin-service
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

grpc:
  server:
    port: ${CHECKIN_GRPC_PORT:9091}   # chỉ mở trong mạng Docker, không publish ra máy chủ
  client:
    auth-service:
      address: ${GRPC_AUTH_SERVICE_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.nqt: ${LOGGING_LEVEL_COM_NQT:INFO}