server:
  port: 8087
  address: ${SERVER_ADDRESS:0.0.0.0}
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 500
    accept-count: 50

spring:
  application:
    name: shop-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

supabase:
  url: ${SUPABASE_URL:https://olgtvgfgpaydkopjhern.supabase.co}
  skin-bucket: ${SUPABASE_SKIN_BUCKET:skin}
  thumbnail-bucket: ${SUPABASE_THUMBNAIL_BUCKET:shop_thumbnail}

sepay:
  api-key: ${SEPAY_API_KEY:your_sepay_api_key_here}
  bank-code: ${SEPAY_BANK_CODE:MBBank}
  account-number: ${SEPAY_ACCOUNT_NUMBER:0123456789}
  account-name: ${SEPAY_ACCOUNT_NAME:PENTAVA}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

grpc:
  client:
    auth-service:
      address: ${GRPC_AUTH_SERVICE_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext
    skin-service:
      address: ${GRPC_SKIN_SERVICE_ADDRESS:static://localhost:9095}
      negotiation-type: plaintext

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.nqt: ${LOGGING_LEVEL_COM_NQT:INFO}
