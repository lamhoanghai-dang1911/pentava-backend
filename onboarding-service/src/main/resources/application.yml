server:
  port: 8083
  address: 127.0.0.1
#  address: 0.0.0.0 mobile

spring:
  application:
    name: onboarding-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/onboarding}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs

grpc:
  client:
    auth-service:
      address: ${GRPC_AUTH_SERVICE_ADDRESS:static://localhost:9090}
      negotiationType: PLAINTEXT

groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.nqt: ${LOGGING_LEVEL_COM_NQT:DEBUG}