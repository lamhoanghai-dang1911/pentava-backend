server:
  port: 8083
  address: ${SERVER_ADDRESS:127.0.0.1}
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 500
    accept-count: 50

spring:
  application:
    name: onboarding-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/onboarding}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

grpc:
  # ➕ MỚI: gRPC server để cinema-service gọi vào lấy danh sách mục tiêu của user.
  # Chỉ mở trong mạng Docker nội bộ, không publish ra máy chủ (giống checkin-service với 9091).
  server:
    port: ${ONBOARDING_GRPC_PORT:9092}
  client:
    auth-service:
      address: ${GRPC_AUTH_SERVICE_ADDRESS:static://localhost:9090}
      negotiationType: PLAINTEXT

groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}

shop-service:
  url: ${SHOP_SERVICE_URI:http://localhost:8087}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.nqt: ${LOGGING_LEVEL_COM_NQT:INFO}