server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:3000"
              - "http://localhost:8080"
              - "http://127.0.0.1:8080"
              - "https://pentava.online"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
        add-to-simple-url-handler-mapping: true

      routes:
        # 1. Định tuyến API của auth-service
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/auth/**

        # 2. Định tuyến file JSON tài liệu docs của auth-service
        - id: auth-service-docs
          uri: ${AUTH_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

        # 3. Định tuyến API của onboarding-service
        - id: onboarding-service-route
          uri: ${ONBOARDING_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/onboarding/**

        # 4. Định tuyến file JSON tài liệu docs của onboarding-service
        - id: onboarding-service-docs
          uri: ${ONBOARDING_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/v3/api-docs/onboarding-service
          filters:
            - RewritePath=/v3/api-docs/onboarding-service, /v3/api-docs

        # 5. Định tuyến API của checkin-service
        - id: checkin-service-route
          uri: ${CHECKIN_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/checkin/**

        # 6. Định tuyến file JSON tài liệu docs của checkin-service
        - id: checkin-service-docs
          uri: ${CHECKIN_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/v3/api-docs/checkin-service
          filters:
            - RewritePath=/v3/api-docs/checkin-service, /v3/api-docs

        # 7. Định tuyến API của cinema-service
        - id: cinema-service-route
          uri: ${CINEMA_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/cinema/**

        # 8. Định tuyến file JSON tài liệu docs của cinema-service
        - id: cinema-service-docs
          uri: ${CINEMA_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/v3/api-docs/cinema-service
          filters:
            - RewritePath=/v3/api-docs/cinema-service, /v3/api-docs

        # 9. Định tuyến API của social-service
        - id: social-service-route
          uri: ${SOCIAL_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/social/**

        # 10. Định tuyến file JSON tài liệu docs của social-service
        - id: social-service-docs
          uri: ${SOCIAL_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/v3/api-docs/social-service
          filters:
            - RewritePath=/v3/api-docs/social-service, /v3/api-docs

        # 11. Định tuyến API của shop-service
        - id: shop-service-route
          uri: ${SHOP_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/shop/**

        # 12. Định tuyến file JSON tài liệu docs của shop-service
        - id: shop-service-docs
          uri: ${SHOP_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/v3/api-docs/shop-service
          filters:
            - RewritePath=/v3/api-docs/shop-service, /v3/api-docs

        # 13. Định tuyến API của skin-service
        - id: skin-service-route
          uri: ${SKIN_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/skin/**

        # 14. Định tuyến file JSON tài liệu docs của skin-service
        - id: skin-service-docs
          uri: ${SKIN_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/v3/api-docs/skin-service
          filters:
            - RewritePath=/v3/api-docs/skin-service, /v3/api-docs

        # 15. Định tuyến API của manage-service
        - id: manage-service-route
          uri: ${MANAGE_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/manage/**

        # 16. Định tuyến file JSON tài liệu docs của manage-service
        - id: manage-service-docs
          uri: ${MANAGE_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/v3/api-docs/manage-service
          filters:
            - RewritePath=/v3/api-docs/manage-service, /v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service (Quản lý tài khoản)
        url: /v3/api-docs/auth-service
      - name: Onboarding Service (Khảo sát đầu vào)
        url: /v3/api-docs/onboarding-service
      - name: Checkin Service (Chụp ảnh check-in)
        url: /v3/api-docs/checkin-service
      - name: Cinema Service (PENTA-CINEMA)
        url: /v3/api-docs/cinema-service
      - name: Social Service (Mạng xã hội)
        url: /v3/api-docs/social-service
      - name: Shop Service (Cửa hàng & Nạp Ruby)
        url: /v3/api-docs/shop-service
      - name: Skin Service (Trang phục & Render Layer)
        url: /v3/api-docs/skin-service
      - name: Manage Service (Quản lý Landing Page & Web)
        url: /v3/api-docs/manage-service

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.nqt: ${LOGGING_LEVEL_COM_NQT:INFO}
    org.springframework.cloud.gateway: INFO
    org.springframework.web.cors: INFO
    reactor.netty.http.server: INFO