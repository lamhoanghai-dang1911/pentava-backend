server:
  port: 8080 # Cổng chính duy nhất mà Client truy cập

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
        add-to-simple-url-handler-mapping: true

      routes:
        # 1. Định tuyến API của auth-service
        - id: auth-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**

        # 2. Định tuyến file JSON tài liệu docs của auth-service
        - id: auth-service-docs
          uri: http://localhost:8082
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

        # 3. Định tuyến API của onboarding-service
        - id: onboarding-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/onboarding/**

        # 4. Định tuyến file JSON tài liệu docs của onboarding-service
        - id: onboarding-service-docs
          uri: http://localhost:8083
          predicates:
            - Path=/v3/api-docs/onboarding-service
          filters:
            - RewritePath=/v3/api-docs/onboarding-service, /v3/api-docs

        # 5. Định tuyến API của checkin-service
        - id: checkin-service-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/checkin/**

        # 6. Định tuyến file JSON tài liệu docs của checkin-service
        - id: checkin-service-docs
          uri: http://localhost:8084
          predicates:
            - Path=/v3/api-docs/checkin-service
          filters:
            - RewritePath=/v3/api-docs/checkin-service, /v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service (Quản lý tài khoản)
        url: /v3/api-docs/auth-service
      - name: Onboarding Service (Khảo sát đầu vào)
        url: /v3/api-docs/onboarding-service
      - name: Checkin Service (Chụp ảnh check-in)
        url: /v3/api-docs/checkin-service

# Cấu hình log chi tiết để theo dõi luồng request và CORS qua Gateway
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.cors: DEBUG
    reactor.netty.http.server: DEBUG