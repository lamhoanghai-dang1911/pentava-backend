server:
  port: ${SERVER_PORT:8089}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: manage-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/manage}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET:pentava-secret-key-for-jwt-token-authentication-minimum-256-bits}

springdoc:
  api-docs:
    path: /v3/api-docs

openapi:
  server-url: ${OPENAPI_SERVER_URL:http://localhost:8080}

shop-service:
  url: ${SHOP_SERVICE_URI:http://localhost:8087}

grpc:
  client:
    auth-service:
      address: ${GRPC_AUTH_SERVICE_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext
    onboarding-service:
      address: ${GRPC_ONBOARDING_SERVICE_ADDRESS:static://localhost:9092}
      negotiation-type: plaintext

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.nqt: ${LOGGING_LEVEL_COM_NQT:DEBUG}
